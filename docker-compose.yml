
### Docker Compose (optional, for local DB)
`docker-compose.yml`
```yaml
version: '3.8'
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: imperium
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: imperium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
